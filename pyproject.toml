[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-tetris"
version = "0.3.0"
description = "A local, persistent GPU task queue with an nvidia-smi-style terminal interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]

[project.scripts]
tetris = "gpu_tetris.cli:main"
tetris-smi = "gpu_tetris.cli:smi_main"

[tool.setuptools.packages.find]
where = ["src"]
